; PlatformIO Project Configuration File for Smart Light ESP32
; Project: Hệ thống điều khiển đèn thông minh qua giọng nói và cử chỉ
; Nhóm 15 - Huỳnh Thái Tấn Nghĩa

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit NeoPixel @ ^1.12.4
    bblanchon/ArduinoJson @ ^7.3.0
